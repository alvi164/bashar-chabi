  <circle cx="256" cy="236" r="14" fill="#FAF9F5" />
  
  <!-- Key Shaft -->
  <path d="M256 280 L256 386" stroke="url(#accent)" stroke-width="22" stroke-linecap="round" />
  
  <!-- Key Teeth -->
