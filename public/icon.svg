      <stop offset="0%" stop-color="#0F4C3A" />
      <stop offset="100%" stop-color="#0A3629" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>
  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- Subtle roof ridge glow -->
  <path d="M256 92 L104 224 L142 224 L256 126 L370 224 L408 224 Z" fill="#E8F2EE" opacity="0.9" />
  
